# ============================================
# Stockify AI - Application Configuration
# ============================================

# Server
server.port=8080

# H2 File-Based Database (Persistent)
spring.datasource.url=jdbc:h2:file:./data/stockify_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# JWT Configuration
app.jwt.secret=StockifyAI2024SecretKeyForJWTTokenGenerationAndValidationMustBeLongEnough256Bits!!
app.jwt.expiration-ms=86400000

# AI Service URL
app.ai.service-url=http://localhost:5000

# Alpha Vantage API (Free tier - 25 requests/day)
app.alphavantage.api-key=demo
app.alphavantage.base-url=https://www.alphavantage.co/query

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.stockify=DEBUG
logging.level.org.springframework.security=WARN

# ============================================
# Mail Configuration (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# ============================================
# Gemini AI Chatbot Configuration (Free Tier)
# Get your free key at: https://aistudio.google.com/app/apikey
# ============================================
app.gemini.key=${GEMINI_API_KEY:MISSING}
app.gemini.model=gemini-2.0-flash
