version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: stockify-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockify_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - stockify-net

  # Python AI Microservice
  ai-service:
    build:
      context: ./stockify-ai
      dockerfile: Dockerfile
    container_name: stockify-ai
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    networks:
      - stockify-net

  # Spring Boot Backend
  backend:
    build:
      context: ./stockify-backend
      dockerfile: Dockerfile
    container_name: stockify-backend
    depends_on:
      - db
      - ai-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/stockify_db?createDatabaseIfNotExist=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - APP_AI_SERVICE_URL=http://ai-service:5000
    networks:
      - stockify-net

  # React Frontend
  frontend:
    build:
      context: ./stockify-frontend
      dockerfile: Dockerfile
    container_name: stockify-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - stockify-net

volumes:
  db_data:

networks:
  stockify-net:
    driver: bridge
